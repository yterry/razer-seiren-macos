name: Release

# Tag-triggered: pushing a v* tag builds the .app, zips it with a checksum, and
# creates a GitHub Release.
#
# Signing is opt-in via repository secrets. When MACOS_CERT_P12 (and friends)
# are present, the build is Developer-ID-signed, notarized, and stapled -
# Gatekeeper opens it with no warning. Without the secrets, the workflow falls
# back to the ad-hoc build with the one-time-bypass release notes, so a release
# can never fail just because signing isn't configured.
#
# Required secrets for signed releases:
#   MACOS_CERT_P12       base64 of the "Developer ID Application" .p12 export
#   MACOS_CERT_PASSWORD  the .p12 export password
#   APPLE_ID             the Apple ID email of the developer account
#   APPLE_TEAM_ID        the 10-character team id
#   NOTARY_PASSWORD      an app-specific password (appleid.apple.com)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required for gh release create

jobs:
  release:
    name: Build & publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAVE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAVE_NOTARY_PW: ${{ secrets.NOTARY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12}" ]; then
            echo "No MACOS_CERT_P12 secret - packaging ad-hoc (unsigned)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Signing is all-or-nothing: once the certificate is present, a
          # missing companion secret fails HERE, loudly - not halfway through
          # the run, and never by silently publishing an unsigned build under
          # a version the README documents as signed and notarized.
          missing=""
          [ -n "${CERT_PASSWORD}" ]        || missing="${missing} MACOS_CERT_PASSWORD"
          [ "${HAVE_APPLE_ID}" = "true" ]  || missing="${missing} APPLE_ID"
          [ "${HAVE_TEAM_ID}" = "true" ]   || missing="${missing} APPLE_TEAM_ID"
          [ "${HAVE_NOTARY_PW}" = "true" ] || missing="${missing} NOTARY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::MACOS_CERT_P12 is set, but these secrets are missing:${missing}. Add them - or remove MACOS_CERT_P12 to intentionally release unsigned."
            exit 1
          fi
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "${KEYCHAIN_PW}" build.keychain
          echo "${CERT_P12}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "${CERT_PASSWORD}" -T /usr/bin/codesign
          rm -f cert.p12
          # Allow codesign to use the key without a UI prompt on the runner.
          security set-key-partition-list -S "apple-tool:,apple:" -s \
            -k "${KEYCHAIN_PW}" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain login.keychain
          SIGN_ID="$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "${SIGN_ID}" ]; then
            echo "::error::MACOS_CERT_P12 imported, but no 'Developer ID Application' identity found in it."
            exit 1
          fi
          echo "Signing as: ${SIGN_ID}"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "sign_id=${SIGN_ID}" >> "$GITHUB_OUTPUT"

      - name: Package .app
        env:
          # Empty when unsigned - package.sh then ad-hoc-signs, as before.
          SIGN_ID: ${{ steps.sign.outputs.sign_id }}
        run: VERSION="${{ steps.ver.outputs.version }}" scripts/package.sh

      # Keep the signed build even if notarization times out or fails - the
      # zip can then be notarized/stapled manually instead of rebuilding.
      - name: Upload signed build as workflow artifact
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-prenotarization
          path: dist/Seiren-*.zip*
          retention-days: 7

      - name: Notarize + staple
        if: steps.sign.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: VERSION="${{ steps.ver.outputs.version }}" scripts/notarize.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "${SIGNED}" = "true" ]; then
            NOTES="Automated build for ${GITHUB_REF_NAME}. Signed with a Developer ID and notarized by Apple - opens with no Gatekeeper warning. Install with \`brew install --cask razer-seiren\` (after \`brew tap yterry/tap\`), update with \`brew update && brew upgrade --cask razer-seiren\`, or grab the zip below. macOS asks for Microphone permission on first launch; the Lighting menu asks for Input Monitoring on first use."
          else
            NOTES="Automated build for ${GITHUB_REF_NAME}. Unsigned .app - see the README 'Install' section for the one-time Gatekeeper bypass (or just \`brew install --cask razer-seiren\`, which clears it for you). macOS asks for Microphone permission on first launch (required to monitor, EQ, and denoise your voice)."
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Seiren-${{ steps.ver.outputs.version }}.zip" \
            "dist/Seiren-${{ steps.ver.outputs.version }}.zip.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${NOTES}"

      # Auto-bump the Homebrew tap so `brew upgrade` sees the new version. This is
      # best-effort: a no-op without a HOMEBREW_TAP_TOKEN secret (a fine-grained
      # PAT for yterry/homebrew-tap with Contents and Pull requests read/write),
      # and `continue-on-error` guarantees that a failed bump (bad token, asset
      # not yet propagated, …) can never fail a release that has already been
      # published in the step above.
      #
      # The bump lands via a PR, not a direct push: the tap's main-branch
      # ruleset requires pull requests with NO bypass actors, so a push to main
      # is rejected for everyone - including this token (verified 2026-08-12,
      # v1.2.0). With zero required approvals the PR can merge immediately;
      # squash keeps the tap history one commit per release.
      - name: Update Homebrew tap
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -uo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret set — skipping tap bump."
            exit 0
          fi
          bump() {
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/yterry/homebrew-tap.git" tap || return 1
            cd tap || return 1
            git checkout -b "cask-${VERSION}" || return 1
            ./scripts/bump-cask.sh "${VERSION}" || return 1
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/razer-seiren.rb
            git diff --cached --quiet && { echo "cask already current"; return 0; }
            git commit -m "razer-seiren ${VERSION}" || return 1
            git push -u origin "cask-${VERSION}" || return 1
            GH_TOKEN="${TAP_TOKEN}" gh pr create --repo yterry/homebrew-tap \
              --title "razer-seiren ${VERSION}" \
              --body "Automated bump from the v${VERSION} release workflow." || return 1
            # A merge failure (e.g. a future required check) is downgraded to a
            # warning: the PR stays open for a one-click manual merge, which
            # beats rebuilding the bump from scratch.
            GH_TOKEN="${TAP_TOKEN}" gh pr merge "cask-${VERSION}" \
              --repo yterry/homebrew-tap --squash --delete-branch \
              || echo "::warning::Tap PR opened but auto-merge failed - merge it manually."
          }
          bump || echo "::warning::Homebrew tap bump failed — run scripts/bump-cask.sh ${VERSION} in the tap manually."
