name: Bug report
description: A feature (monitoring, EQ, noise suppression, lighting) doesn't work, or the app misbehaves
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you installed Seiren
      options:
        - Homebrew
        - Downloaded zip from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Microphone model
      placeholder: Seiren V3 Pro, Seiren V3 Mini, ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Click the Seiren icon in the menu bar, choose **Copy Diagnostics** (near the bottom of the menu, just above **Quit Seiren**), and paste the result here.
        Review the text before posting; it lists your audio devices and recent app events.
      render: text
    validations:
      required: true
  - type: textarea
    id: seiren-probe
    attributes:
      label: seiren-probe output (optional, only if you build from source)
      description: |
        The output of `swift run seiren-probe`.
        For "I hear nothing", also `swift run seiren-probe monitor swmon 0.9`; for a mic with no headphone jack, `swift run seiren-probe route`.
      render: text
    validations:
      required: false
